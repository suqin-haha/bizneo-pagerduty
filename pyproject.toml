[project]
name = "bizneo-oncall"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.46.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv]
# uv's downloaded Pythons fail on this machine with "Unknown operating system".
# Use the system interpreter only.
python-preference = "only-system"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
